<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5e8" />
      <stop offset="100%" stop-color="#ffe4d3" />
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3c4a0" />
      <stop offset="100%" stop-color="#d4a37e" />
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#e89c7a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e89c7a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)" />

  <!-- Shoulder / clothing -->
  <ellipse cx="200" cy="500" rx="220" ry="120" fill="#ffffff" />

  <!-- Hair (back) -->
  <ellipse cx="200" cy="200" rx="135" ry="115" fill="#3a2a20" />
  <ellipse cx="200" cy="240" rx="135" ry="115" fill="#3a2a20" opacity="0.85" />

  <!-- Face -->
  <ellipse cx="200" cy="245" rx="92" ry="118" fill="url(#skin)" />

  <!-- Neck -->
  <path d="M 165 350 L 165 400 Q 200 420 235 400 L 235 350 Z" fill="url(#skin)" />

  <!-- Cheek blush -->
  <ellipse cx="158" cy="285" rx="22" ry="14" fill="url(#cheek)" />
  <ellipse cx="242" cy="285" rx="22" ry="14" fill="url(#cheek)" />

  <!-- Hair fringe -->
  <path d="M 110 195 Q 200 130 290 195 Q 280 230 200 215 Q 120 230 110 195 Z" fill="#3a2a20" />

  <!-- Eyebrows -->
  <path d="M 150 220 Q 170 213 188 220" stroke="#3a2a20" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 212 220 Q 230 213 250 220" stroke="#3a2a20" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Eyes -->
  <ellipse cx="170" cy="240" rx="7" ry="5" fill="#2a2018" />
  <ellipse cx="230" cy="240" rx="7" ry="5" fill="#2a2018" />
  <circle cx="172" cy="239" r="1.5" fill="white" />
  <circle cx="232" cy="239" r="1.5" fill="white" />

  <!-- Nose -->
  <path d="M 200 250 Q 195 285 198 295 Q 200 298 202 295 Q 205 285 200 250" stroke="#c79373" stroke-width="1.2" fill="none" />

  <!-- Lips -->
  <path d="M 178 320 Q 200 330 222 320 Q 200 310 178 320 Z" fill="#a86660" />
  <path d="M 178 320 Q 200 322 222 320" stroke="#7a4540" stroke-width="0.8" fill="none" />

  <!-- Subtle ear hint -->
  <ellipse cx="105" cy="255" rx="12" ry="20" fill="url(#skin)" />
  <ellipse cx="295" cy="255" rx="12" ry="20" fill="url(#skin)" />
</svg>
